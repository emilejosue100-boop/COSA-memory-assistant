# Render Blueprint — Kumbuka backend API
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Or create a Web Service manually with the commands below.

services:
  - type: web
    name: kumbuka-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    # Install devDependencies too — tsc and @types/* are required for the TypeScript build
    buildCommand: cd .. && npm install --include=dev && npm run build --workspace=kumbuka-backend
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COCKROACH_DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: GEMINI_MODEL
        sync: false
